services:
  # 静态 Web：发布浏览器端审计页，仅提供静态文件与 /healthz。
  web:
    build:
      context: .
      target: runtime
    image: signed-inversion-audit-web:latest
    # 宿主机端口可通过环境变量 WEB_PORT 配置（默认 8080）。
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "server/healthcheck.mjs"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  # 一次性验证服务：退出码 0 表示全部通过。
  # 运行：docker compose build verify && docker compose up --build verify
  # 查看退出码：docker compose ps -a verify （或 docker inspect ... .State.ExitCode）
  verify:
    build:
      context: .
      target: verify
    image: signed-inversion-audit-verify:latest
    environment:
      BASE_URL: "http://web:8080"
      SMOKE_TIMEOUT_MS: "60000"
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        echo "== 1/4 单元测试（vitest，含暴力枚举交叉验证） =="
        npm test
        echo "== 2/4 构建检查（tsc 类型检查 + vite 静态构建） =="
        npm run build
        echo "== 3/4 需求核查（[1,-3,-2,4] 距离 1；重复绝对值被拒绝） =="
        npm run check:requirements
        echo "== 4/4 HTTP 冒烟（等待 web 健康后检查 healthz 与首页） =="
        node scripts/smoke.mjs
        echo "== verify 全部通过 =="
